# The demos on GitHub Pages: the starter built with each shell, at /<repo>/clean/ and
# /<repo>/room/, exactly as it is in starter/ with only its address and shell set.
name: Demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build both
        env:
          SITE: https://${{ github.repository_owner }}.github.io
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          for shell in clean room; do
            (cd starter && CREATURES_SHELL=$shell BASE="/$repo/$shell/" npx astro build)
            mkdir -p "_site/$shell"
            cp -R starter/dist/. "_site/$shell/"
          done
          cat > _site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=clean/">
          <title>$repo</title>
          <a href="clean/">clean</a> · <a href="room/">room</a>
          HTML
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
